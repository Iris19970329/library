<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>圖書借閱系統</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/vue@3.3.4/dist/vue.global.min.js"></script>
</head>

<body>
	<div id="app" style="background-color: #5CADAD; width:100%; height: 100%; padding-bottom: 5%;">
		<nav class="navbar navbar-expand-lg" style="background-color: #408080;">
			<div class="container-fluid">
				<a class="navbar-brand" href="main.html" style="color: white;">圖書借閱系統</a>
				<div class="collapse navbar-collapse">
					<ul class="navbar-nav me-auto mb-2 mb-lg-0">
						<li class="nav-item">
							<a class="nav-link active" href="main.html" style="color: white;">首頁</a>
						</li>
						<li class="nav-item"  v-if="isLoggedIn">
							<a class="nav-link active" href="record.html" style="color: white;">借閱紀錄</a>
						</li>
					</ul>
					<!--<a href="login.html" class="btn btn-light ms-auto">登入</a>
					<a href="signup.html" class="btn btn-light mx-3">註冊</a>-->
					<div v-if="!isLoggedIn">
						<a href="login.html" class="btn btn-light ms-auto">登入</a>
						<a href="signup.html" class="btn btn-light mx-3">註冊</a>
					</div>
					<div v-else>
						<span class="text-white me-3">歡迎，{{ username }}</span>
						<button class="btn btn-light" @click="logout">登出</button>
					</div>

				</div>
			</div>
		</nav>

		<table class="table table-border" style="width: 80%; margin: 5% auto 30% auto;">
			<thead>
				<tr>
					<th>ISBN</th>
					<th>書名</th>
					<th>借閱時間</th>
					<th>歸還時間</th>
					<th>借閱狀態</th>
					<th></th>
				</tr>
			</thead>
			<tbody>
				<tr v-for="(br, index) in borrowrecord" :key="index">
					<td>{{ br.iSBN }}</td>
					<td>{{ br.bookname }}</td>
					<td>{{ br.borrowingTime }}</td>
					<td>{{ br.returnTime }}</td>
					<td>{{  br.status === 1 ? '借閱中' : '已歸還' }}</td>
					<td>
						<button v-if="br.status === 1" class="btn btn-success" @click="returnBook(br.iSBN)">
							歸還
						</button>
					</td>
				</tr>
			</tbody>
		</table>
	</div>

	<script>
		const {createApp, ref, onMounted} = Vue;

		createApp({
			setup() {
				const borrowrecord = ref([]);
				const isLoggedIn = ref(false);
				const username = ref('');


				const fetchRecord = () => {
					axios.get('/getBorrowRecord')
						.then(response => {
							borrowrecord.value = response.data;
						})
						.catch(error => {
							console.error('獲取書籍失敗:', error);
						});
				};

				const checkLogin = () => {
					axios.get('/checkLogin')
						.then(response => {
							if (response.data.loggedIn) {
								isLoggedIn.value = true;
								username.value = response.data.username;
							} else {
								isLoggedIn.value = false;
							}
						})
						.catch(err => {
							console.error('檢查登入狀態失敗:', err);
						});
				};

				const logout = () => {
					axios.post('/logout')
						.then(() => {
							alert('已登出');
							window.location.href = 'main.html';
						})
						.catch(err => {
							console.error('登出失敗:', err);
						});
				};

				const returnBook = (iSBN) => {
					const requestData = {iSBN: iSBN};

					axios.post('/returnBook', requestData)
						.then(response => {
							const res = response.data;
							if (res.responsecode === '0000') {
								alert('還書成功');
								fetchRecord(); // 更新借閱狀態
							} else if (res.responsecode === '0008') {
								alert('請先登入後再還書');
								window.location.href = 'login.html';
							} else {
								alert('還書失敗：' + res.responsedescription);
							}
						})
						.catch(error => {
							console.error('還書錯誤:', error);
							alert('系統錯誤，請稍後再試');
						});
				};


				onMounted(() => {
					fetchRecord();
					checkLogin();
				});

				return {
					borrowrecord,
					returnBook,
					isLoggedIn,
					username,
					logout
				};
				
			}
		}).mount("#app");
	</script>
</body>

</html>
